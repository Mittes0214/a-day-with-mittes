# Mittes 的一天 — 插件配置
#
# 这里只放开关和参数。日程骨架、底稿都在 schedule/skeleton.toml（纳入版本库），
# 因为 config.toml 被 gitignore，手写资产放这里会丢失版本历史。

[plugin]
enabled = true
config_version = "3.6.0"

[components]
# 关掉的 Tool 完全不会出现在 LLM 的 tool_definitions 里；改动需要重启 MaiBot 才生效
enable_get_mittes_schedule = true
enable_get_mittes_outfit = true
enable_get_weather = true

[generation]
# 每天几点跑批次（JST）。生成的是**次日**全天——12:00 才生成当天的话，
# 00:00~12:00 那几段早就过去了。
run_at = "12:00"

# 各轮 LLM 调用**直接指定模型名**（`model_config.toml` 的 `[[models]].name`），
# 不再填任务名。
#
# 为什么：任务名只决定候选池，不决定具体模型。`replyer` 的 selection_strategy
# 是 random，四个模型随机挑，sonnet 5 只有 1/4 的概率——而整套 prompt 的判据
# （故事性、mood 质地、禁名词）是照着 sonnet 5 的水平定的，随机挑模型会让每天
# 的质量方差压过 prompt 本身的影响。
model = "claude-sonnet-5"

# 话题提炼（第二轮）。和主生成分开配：创作和抽取是两件事，本可以用便宜模型。
# 这里仍然填同一档，是因为 topic 常驻注入到 replyer——写得糙一点，她开口就糙一点。
topic_model = "claude-sonnet-5"

# 表达方式生成（第三轮）。每个时段根据已生成的 story 和 mood 单独生成。
expression_model = "claude-sonnet-5"

# 基座任务名：模型、温度、max_tokens 全由上面几个键覆盖，这里真正借用的是它的
# hard_timeout 和统计管线。
#
# **选 memory 是为了超时**：它的 hard_timeout 是 240 秒，而 replyer 只有 60 秒、
# utils 只有 20 秒。主生成一次要吐全天十来段，实测 147~195 秒；话题提炼一次吞十段
# story 再吐十条 topic。第三轮每个时段单独生成表达方式。240 秒只剩两成余量，
# 顶穿了就整天退底稿——那时候该换一个
# hard_timeout 更宽的基座任务，而不是缩这边。
base_task = "memory"

temperature = 0.9

# 每周安排几次「不顺心的事」。排期只决定何时、多重，具体发生什么由生成时现编。
negative_event_quota = 2

# 这几次里判为「中等」强度的比例，其余为「轻微」。
# 中等会压着接下来两三个时段的情绪；没有「重大」这一档。
negative_medium_ratio = 0.3

[observability]
# 每次 LLM 调用是否落盘到 WebUI 推理过程页。
# 主程序的预览开关只管主程序自己写的记录，管不到插件，所以这里必须自带一个。
prompt_preview_enabled = true

# 每个目录保留多少条记录。改成一次出全天之后，一天只写三五条（全天生成一次 +
# 不合格段的定向重写若干 + 第二轮抽取一次），256 条能覆盖两个月，
# 上限沿用主程序 maisaka_prompt_preview_limit 的默认值。
prompt_preview_limit = 256

# 批次结果报到哪个群；留空则不报告。成功和失败都报——静默成功等于没有监控。
report_group_id = ""
report_platform = "qq"

# 天气查询用的地名，英文/罗马字
weather_location = "Tokyo"
