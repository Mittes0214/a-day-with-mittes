# Mittes 的一天 — 插件配置
#
# 这里只放开关和参数。日程骨架、底稿都在 schedule_skeleton.toml（纳入版本库），
# 因为 config.toml 被 gitignore，手写资产放这里会丢失版本历史。

[plugin]
enabled = true
config_version = "3.1.0"

[components]
# 关掉的 Tool 完全不会出现在 LLM 的 tool_definitions 里；改动需要重启 MaiBot 才生效
enable_get_current_schedule = true
enable_get_weather = true

[generation]
# 每天几点跑批次（JST）。生成的是**次日**全天——12:00 才生成当天的话，
# 00:00~12:00 那几段早就过去了。
run_at = "12:00"

# 时段生成用的模型任务名，取值是 model_config.toml 的 [model_task_config.*] 键
# （replyer / planner / utils / memory / ...）。
#
# **不要留空**：留空会走主程序的「第一个可用任务」兜底，那是 dict 的迭代顺序，
# 拿到什么全看配置文件怎么写，实测会 404。
#
# story 要写出有起承的小事件、mood 要写出「小鹿乱撞」这种质地，
# 小模型会稳定退化成「翻着漫画，觉得很开心」，prompt 规则再细也救不回来。
model = "replyer"

# 当日概要滚动压缩用的模型，输入永远只有三百来字，用便宜的就行。
digest_model = "utils"

temperature = 0.9

# 每周安排几次「不顺心的事」。排期只决定何时、多重，具体发生什么由生成时现编。
negative_event_quota = 2

# 这几次里判为「中等」强度的比例，其余为「轻微」。
# 中等会压着接下来两三个时段的情绪；没有「重大」这一档。
negative_medium_ratio = 0.3

[observability]
# 每次 LLM 调用是否落盘到 WebUI 推理过程页。
# 主程序的预览开关只管主程序自己写的记录，管不到插件，所以这里必须自带一个。
prompt_preview_enabled = true

# 每个目录保留多少条记录。一天约写 20 条（10 次生成 + 10 次概要压缩），
# 256 条大约覆盖十三天，跟主程序的 maisaka_prompt_preview_limit 默认值对齐。
prompt_preview_limit = 256

# 批次结果报到哪个群；留空则不报告。成功和失败都报——静默成功等于没有监控。
report_group_id = "181089267"
report_platform = "qq"

# 天气查询用的地名，英文/罗马字
weather_location = "Tokyo"
