# a_day_with_mittes - Mittes 的一天插件 配置模板
#
# 使用方法：把本文件复制为同目录下的 config.toml，再把各时段活动改成你的角色设定。
# 本插件使用手动配置读取（无 pydantic 模型），config.toml 不会自动生成；
# 缺失日程时 get_current_schedule 工具会一直返回「当前没有日程信息」（天气工具不受影响）。
#
# 时段键格式：time_range_HH_NN（起止小时，23 点跨零点写作 time_range_23_00）。
# 某个时段留空字符串时，当天当前时段落在该格则整个工具返回「没有日程信息」，
# 建议每格都填。

# 日程注入的实时天气：get_current_schedule 返回时附带此地点的当前天气摘要。
# 取值用英文/罗马字地名（如 Tokyo、Shanghai），避免中文被匹配到同名小地名。
# 注意：这是顶层键，必须放在所有 [表] 头之前，否则会被归入上一个表导致读取不到。
weather_location = "Tokyo"

[plugin]
# 是否启用插件
enabled = true

