# Mittes 一周时段骨架（秋 · 学期中）
#
# 字段说明
#   start / end  时段边界。**逻辑日从 02:00 起算，跨零点用 24:00+ 记法**，见下
#   title        时段名称，几个词，不写文笔
#   place        地点          ┐
#   outfit       穿搭名字      ├ 给 LLM 的素材支点，不是机器读的
#   company      在场的人      ┘
#   kind         性质，机器读：睡眠 / 工作 / 上学 / 自由 / 通勤 / 外出
#
# ── 逻辑日：02:00 → 次日 02:00 ──
#
# 一天不从零点开始，从她入睡的 02:00 开始，到次日 02:00 结束。跨零点那一段
# 写成 `24:00-26:00`（日本的节目表就是这么记的），归属**当天**而不是次日。
#
# 为什么：按日历日切会把同一个夜晚劈成两半，写骨架的人在 24:00 收笔、在 00:00
# 重新起笔，于是同一个晚上被设计了两次收尾——旧版就出现过「23:00 睡前护肤 →
# 次日 00:00 卸妆」这种倒序。而且「已清醒几小时」是从当天最后一个睡眠段之后
# 算的，凌晨那段前面没有睡眠段，会算出「清醒 0 小时」，正好在她一天里最累的
# 时刻告诉模型她刚睡醒。
#
# 睡眠段放在逻辑日**开头**，所以「已清醒」自动从起床那一刻算起，不用改代码。
#
# ── 切分原则 ──
#
#   1. 清醒时段 1~3.5 小时，不超过 4 小时。
#   2. 睡眠段是唯一例外（5.5~8 小时），一段到底——切开没有意义，
#      拆成两段只会让生成器为「睡着的第二段」白写一次 story。
#   3. 有几段不到 1 小时（午休、换装、洗澡），是有意保留的：
#      它们的 place / outfit / company 跟前后段都不同，合并会丢掉支点。
#
# ── 关于体力：困意和劳累是两回事 ──
#
# 设计目标是**正常的一天里，02:00 上床之前不因为「困」掉进「不佳」**。
#
# **累是可以的。** 她放学后站五个小时的班，腿酸、胳膊没劲、整个人被榨干，这些照写，
# 也该判「不佳」。不该出现的是困：打哈欠、眼睛睁不开、意识开始往下飘——这类东西
# 在 02:00 之前没有位置。
#
# 两者在群里的表现差得远。累但清醒的人还能说话，只是少了力气；困的人是在往下掉，
# 说什么都接不上。22:00~02:00 正好是她真会被搭话的时段，整晚处在困里等于整晚说不动话。
#
# 困意只有两个合法的位置：
#
#   1. 刚醒来那一小会儿——人设写明「刚醒时反应比平常慢，话也少，清醒之后很快恢复」。
#   2. 02:00 前后临睡那一刻。
#
# 中间十几个小时不管多累，都不该写成困。
#
# 2026-09-14 改这一版之前的九天实测：19:00 起「不佳」占 57%，22:00 之后占 89%，
# 末段九天里八天是「不佳」。对照组说明了原因——周日是全休日，10:00 才起床，全天
# 只是逛街喝咖啡，清醒十二个半小时没干重活，22:30 照样判「不佳」。**写手是按「深夜」
# 判的**，到了深夜就写困，和当天干了多少活没关系。
#
# 唯一两次例外都指向同一个开关：09-11 末段「明天不用早起，越看越精神」判了「一般」，
# 09-10 周四全天没有困意字眼，22:00 和 23:00 两段都是「一般」。
#
# 所以这份骨架只有一条规矩：
#
#   **title 里不写困意。** 不写「开始困」「很快就困了」「撑着不打哈欠」这类词。
#   title 是写手最硬的支点，写进去等于把困钉死，第一轮生成没有翻盘余地。
#   **腿酸、脚站得发酸、被榨干照写不误**，那是劳累不是困意，两者不要一起删。
#
# 边界（时段起止）不是这件事的开关，实测与当天负荷无关，所以这一版没有动任何边界。
# 剩下的一半在 `generation/prompts/01_生成全天故事与情绪.prompt` 里：那边
# `physical_state` 的说明把「疲劳、困意、乏力」并列，`energy_level` 的「不佳」
# 又直接写成「明显困倦乏力」——两个通道在字段定义里就是黏着的，得拆开。

# ── place 可以写多个地点 ──
#
# 一段里换地方是**期望的行为**，不是将就。骨架的 place 几乎不进注入——真正注入
# planner 的「所在」走 `state.places` 时段轴，第二轮从 story 里提取「她这段时间
# 待过哪些地方，按先后排成一条时段轴」，`place_at()` 按当前时刻在轴上取。
#
# 骨架的 place 只在**退回底稿时**才被当注入内容用（生成失败、旧数据、冷启动），
# 那条路径是 `place.split("/")[0]`。所以多地点**用 `/` 分隔，第一个放最有代表性的
# 那个**——用「与」字连接的话 split 不生效，底稿时会把整串注进去。
#
# ── outfit 填的是穿搭名字 ──
#
# 取值必须是 `character/wardrobe.toml` 里的套装名。骨架只填名字，从头到脚的细节在那边，
# 只给穿搭查询工具用，不进 story 的 prompt。
#
# 学期版里**每一个 outfit 都在衣柜里**，没有例外。暑假版那个「当天的拍摄服装」
# 随周五棚拍一起去掉了，理由见下面「关于拍摄」。
#
# ── 关于上学 ──
#
# 东洋高等学校二年 A 班，千代田区神田三崎町。通学是曙桥站坐都营新宿线本八幡方向，
# 神保町下车再走八分钟，门到门约二十五分钟。她起床到出门约四十分钟，闹钟设三个、
# 隔五分钟，通常到第二或第三个才真起来——所以上课日的睡眠段只有 5.5 小时，
# 是全周最短的，这个短是有意的，不要拉长。
#
# 这 5.5 小时是几何锁死的：就寝 02:00 是定下的，08:45 到校、门到门 25 分钟、
# 起床到出门 40 分钟，往回推最晚只能 07:30 起。人设文档写她「通常睡六小时就能保持
# 正常状态，少于这个时长时第二天会明显困倦」，5.5 小时正好踩在基线下面——写手因此
# 有理由把上课日整天写成累的。**这是她长期的常态作息，不是偶发的睡眠不足**，
# 这一点骨架说不清楚，得在 story prompt 里讲明白。
#
# **周一到周五都上课。** 学校部分按场景切，不按课时切：
#
#   08:45-12:20  上午的文化课    学校教室
#   12:20-13:10  午休           天台 / 中庭 / 食堂 —— 换地方、只剩 Niya
#   13:10-15:40  下午的特色课    按课换地方（实验室、调理实习室、体育馆…）
#   15:40-17:00  放学后再回店    图书室 / 部室 / 教室，接上电车
#
# 早先每天排三段课堂，写出来的 story 千篇一律，原因不在 title 而在**支点**：
# 骨架给写手的锚是 place / outfit / company / kind 四样，三段课这四样一模一样，
# 只有 title 在动，写手没东西可抓。现在一天里学校部分有三次支点变化。
#
# 课堂减到两段还有个现实理由：`上学` 是 busy kind，planner 在这几段本来就压低
# 发言意愿，这些段的 story 对实际聊天影响最小，不值得为它多花生成成本。
#
# **上午固定文化课，下午给特色课。** 上午那段是她最没张力的时间——成绩长期年级前列、
# 理解快、又「没有把生活重心放在学习上」，既不吃力也不在意——一段带过就好。
# 下午按天换课，地点跟着换：
#
#   周一  美术 / 视觉表达      她想考艺术类大学的视觉设计，是稳定强项
#   周二  物理实验课，分组做    理科方向，物理是她喜欢的科目
#   周三  短缩授业，下午没课    日本高中周三普遍如此，空出来的下午和 Niya 出去
#   周四  家庭科调理实习       她的主场，会做饭会烘焙
#   周五  体育课，球类或体力测试  协调性好、耐力普通，短距离行长跑不行
#
# **体育课不排长跑。** 她不喜欢长跑，但喜欢花样滑冰、会基础游泳、能跟着视频学完
# 一支舞——球类、创作ダンス、九月还没关的游泳课都比跑圈好写。
#
# **化学是最弱的一科，只放在上午当支点**（小测发下来那种），不给整段。
# 弱项占一整段容易写成受苦流水账。
#
# 她**没有加入固定社团**，摄影部要临时模特或帮忙看造型时才去搭把手——那是偶发的，
# 每周只在放学后放了一次，不要因为它出现在骨架里就当成固定社团活动。
#
# 学校就在神保町站，旧书街是她放学后最常去的地方（周一和周五各安排了一次）。
#
# ── 关于放学后的班 ──
#
# 店铺**周一休息**，周二至周日 11:00 营业、21:00 打烊、20:30 最后点单。
# 上课期间白天由 Sweyn 独自看店，**Mittes 和 Niya 放学后才换上女仆装来帮忙**，
# 正好接住 16:30–18:30 那波放学后的客流。所以：
#
#   周一        店休 → 放学后是她自己的时间（神保町、大扫除）
#   周二~周五    放学后进店，17:00 到 22:00 一路到打烊；周三短缩，16:00 就进店
#   周六        不上课，全天班
#   周日        不上课，全休出门
#
# 一周只有周日一天完全没有课也没有班，这是有意的：学期里她的自由时间就是这么少。
#
# ── 关于拍摄 ──
#
# 正式 Cos 拍摄和漫展大约**每两三个月才一次**，不是每周固定项，所以学期骨架里
# 没有拍摄段。暑假版把周五整天给了棚拍，那是假期才成立的安排。真要拍的时候
# 走前端「生成指定日期日程」单独排，不要为它改这份每周骨架。
#
# ── 关于校服 ──
#
# 现在填的是 `藏青格纹夏季校服`。日本高中 10 月 1 日衣替え换冬服，学校的冬季正装
# 是绿色西装外套配红色领结，**衣柜里还没有这一套**。到十月要先往
# `character/wardrobe.toml` 加条目，再把这份骨架里的校服名换掉，两边一起改。
#
# ── 关于天气 ──
#
# 骨架里不写天气，天气来自 Open-Meteo 实时查询。露台、逛街这类户外段遇到坏天气，
# 由 LLM 自行改写成室内的做法，骨架不动。


# ══════════════════════════ 底稿 ══════════════════════════
# 冷启动、生成失败、缓存缺失时顶上的默认状态，按 kind 各一套。
# story 不在这里写，由 title + place 现拼一句；topic 和 places 底稿一律留空。

[fallback."睡眠"]
manner = "你睡得正沉，被吵醒的话反应会慢半拍，话也接不太上。"
mood   = "迷糊，还没醒透"

[fallback."工作"]
manner = "你手上一直有事，说话容易被打断，接得急也短。"
mood   = "专注，绷着一根弦"

[fallback."上学"]
manner = "你人在一件正事里，回话简短，注意力只分得出一点。"
mood   = "端着劲，不太松"

[fallback."自由"]
manner = "你这会儿是松着的，说话慢悠悠，容易顺着话题跑远。"
mood   = "松弛，懒洋洋"

[fallback."通勤"]
manner = "你在路上，回话短，隔一会儿才接一句。"
mood   = "悬着，等着到地方"

[fallback."外出"]
manner = "你的注意力分了一半给周围，回话短，偶尔会断一下。"
mood   = "轻快，有点分神"

