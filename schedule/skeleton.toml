# Mittes 一周时段骨架（秋 · 学期中）
#
# 这份文件只有头部注释是写给改骨架的人看的；生成日程的 LLM 看不到注释，
# 只拿到每段的 start / end / title / place / outfit / company / kind。
#
# ── 字段 ──
#
#   start / end  时段边界，逻辑日记法，见下
#   title        这段时间在做什么，几个词，不写文笔
#   place        地点。多个地点用 ` / ` 分隔，最有代表性的放第一个
#   outfit       穿搭名字，必须是 `character/wardrobe.toml` 里已有的套装名
#   company      在场的人
#   kind         机器读，只能是：睡眠 / 工作 / 上学 / 自由 / 通勤 / 外出
#
# kind 会影响行为：`睡眠 / 工作 / 上学` 在 config 的 busy_kinds 里，这几段她不主动
# 开话头。排错 kind 等于排错她那段时间的发言意愿。
#
# ── 格式硬约束（加载时校验，不满足直接报错）──
#
#   1. 逻辑日 02:00 → 次日 02:00。跨零点那段写成 `24:00-26:00`，归属当天。
#   2. 每张表的时段首尾相接、铺满整个逻辑日，不留空档、不重叠。
#   3. 所有表的首段从同一时刻（02:00）开始，首段是睡眠段。
#   4. 用到的每个 kind 都要有对应的 `[fallback."<kind>"]`。
#
# ── 切分 ──
#
#   1. 清醒时段 1~3.5 小时，不超过 4 小时。
#   2. 睡眠段一段到底，不拆。
#   3. 不到 1 小时的短段（午休、换装、洗澡）只在 place / outfit / company
#      跟前后段都不同时才单独成段。
#   4. 相邻几段的 place / outfit / company / kind 不要完全相同，否则写手只剩
#      title 可抓，写出来千篇一律。
#
# ── title 怎么写 ──
#
#   1. 只写做什么。**不写体力**：困、累、腿酸、没力气这类词都不放进 title，
#      体力由生成侧根据当天情节自己判断。
#   2. 不写天气。天气是实时查询的，坏天气时由生成侧自行改成室内的做法。
#   3. 不提「明天」要干什么。连休长度是按日期现算的，写死会对不上。
#   4. 不写只在某几周成立的事（文化祭、考试、某一季的限定菜单）。这是每周
#      重复用的表，那类日子走文末的 `[calendar.override]` 或单独生成。
#
# ── 固定事实：上学 ──
#
# 东洋高等学校二年 A 班（千代田区神田三崎町）。周一到周五都上课。
# 通学：曙桥站 → 都营新宿线 → 神保町站，门到门约 25 分钟。
#
#   02:00-07:30  睡眠           上课日固定 5.5 小时，不要拉长
#   07:30-08:45  起床到进校      通勤
#   08:45-12:20  上午的文化课    教室，一段带过
#   12:20-13:10  午休           天台 / 中庭 / 食堂
#   13:10-15:40  下午的特色课    按课换地方
#   15:40-17:00  放学后         图书室 / 部室 / 教室 / 旧书街，接上电车
#
# 下午的课按天固定：
#
#   周一  美术 / 视觉表达
#   周二  物理实验课，分组做
#   周三  短缩授业，下午没课，15:00 前后离校
#   周四  家庭科调理实习
#   周五  体育课（球类、舞蹈、体力测试，不排长跑）
#
# 写 title 时用得上的人设：成绩长期年级前列；数学最好，物理、历史和视觉表达
# 也是强项；化学最弱，只在上午那段当个小支点，不给整段；没有加入固定社团，
# 摄影部偶尔叫她帮忙，一周最多出现一次。
#
# ── 固定事实：店 ──
#
# 店铺周一定休，周二至周日 11:00 营业、20:30 最后点单、21:00 打烊。
#
#   周一        店休，放学后是她自己的时间（去冰场练滑冰）
#   周二~周五    放学后进店，17:00 到 22:00；周三短缩，16:00 就进店
#   周六        不上课，下午起当班到打烊
#   周日        不上课也不当班，全休
#
# 一周只有周日完全空着，不要再加第二个全休日。
# 正式拍摄和漫展不进周表，要排的时候从前端「生成指定日期日程」单独生成。
#
# ── 穿搭 ──
#
# 这一版配的是秋季衣柜（东京十月到十一月），校服是 `白色长袖水手服配藏青百褶裙`
# （十月换冬服，用到开春）。十二月入冬要再换一版。
# 换季时 `character/wardrobe.toml` 和这份骨架一起整份替换，两边的名字要对得上。
#
# ── 九张表 ──
#
#   schedule_mon ~ schedule_sun  周一到周日
#   schedule_holiday_shift       祝日，学校休、店照开（祝日落在周二~周日）
#   schedule_holiday_free        祝日，学校和店都休（祝日落在周一）
#
# 祝日用哪张表由代码按日期自动选，不用手写。`schedule_holiday_free` 的内容
# 不要和周日那张撞：它前一天必然是周日，两天不能是同一种过法。
#
# 校历上的特殊日子（文化祭、体育祭、考试周、休校日）写进文末的
# `[calendar.override]`，一行 `"2026-10-31" = "schedule_holiday_free"`，
# 优先级高于祝日规则和星期几。


# ══════════════════════════ 底稿 ══════════════════════════
# 冷启动、生成失败、缓存缺失时顶上的默认状态，按 kind 各一套。
# story 不在这里写，由 title + place 现拼一句；topic 和 places 底稿一律留空。

[fallback."睡眠"]
manner = "你睡得正沉，被吵醒的话反应会慢半拍，话也接不太上。"
mood   = "迷糊，还没醒透"

[fallback."工作"]
manner = "你手上一直有事，说话容易被打断，接得急也短。"
mood   = "专注，绷着一根弦"

[fallback."上学"]
manner = "你人在一件正事里，回话简短，注意力只分得出一点。"
mood   = "端着劲，不太松"

[fallback."自由"]
manner = "你这会儿是松着的，说话慢悠悠，容易顺着话题跑远。"
mood   = "松弛，懒洋洋"

[fallback."通勤"]
manner = "你在路上，回话短，隔一会儿才接一句。"
mood   = "悬着，等着到地方"

[fallback."外出"]
manner = "你的注意力分了一半给周围，回话短，偶尔会断一下。"
mood   = "轻快，有点分神"

