# Mittes 一周时段骨架（冬 · 十二月到二月 · 学期中）
#
# 这份文件只有头部注释是写给改骨架的人看的；生成日程的 LLM 看不到注释，
# 只拿到每段的 start / end / title / place / outfit / company / kind。
#
# ── 字段 ──
#
#   start / end  时段边界，逻辑日记法，见下
#   title        这段时间在做什么，几个词，不写文笔
#   place        地点。多个地点用 ` / ` 分隔，最有代表性的放第一个
#   outfit       穿搭名字，必须是 `character/wardrobe.toml` 里已有的套装名
#   company      在场的人
#   kind         机器读，只能是：睡眠 / 工作 / 上学 / 自由 / 通勤 / 外出
#
# kind 会影响行为：`睡眠 / 工作 / 上学` 在 config 的 busy_kinds 里，这几段她不主动
# 开话头。排错 kind 等于排错她那段时间的发言意愿。
#
# ── 格式硬约束（加载时校验，不满足直接报错）──
#
#   1. 逻辑日 02:00 → 次日 02:00。跨零点那段写成 `24:00-26:00`，归属当天。
#   2. 每张表的时段首尾相接、铺满整个逻辑日，不留空档、不重叠。
#   3. 所有表的首段从同一时刻（02:00）开始，首段是睡眠段。
#   4. 用到的每个 kind 都要有对应的 `[fallback."<kind>"]`。
#
# ── 切分 ──
#
#   按她方不方便回消息决定切多细：
#
#   1. 睡眠段一段到底，不拆。
#   2. 上课时段切碎：每份是「课间 + 下一节课」，约 70 分钟，不按真实的 50 分钟
#      一节、10 分钟课间去对齐。第一份用进校到早班会前代替课间。
#   3. 能随时回消息的时段（没课的下午、在家、外出）不必细切；店里的班保持两三
#      小时一段。
#   4. 相邻几段的 place / outfit / company / kind 不要完全相同，否则写手只剩
#      title 可抓，写出来千篇一律。
#
# ── title 怎么写 ──
#
#   1. 只写做什么。困、累、腿酸、没力气这类词都不放进 title。
#   2. 不写天气。天气是实时查询的，坏天气时由生成侧自行改成室内的做法。
#   3. 不提「明天」要干什么。连休长度是按日期现算的，写死会对不上。
#   4. 不写只在某几周成立的事（文化祭、考试、某一季的限定菜单）。这是每周
#      重复用的表，那类日子走文末的 `[calendar.override]` 或单独生成。
#   5. 上课段写成「课间那件事 + 第几节什么课 + 一个轻的点」。planner 只看得到
#      story 抽出来的地点轴，课间的事放在前面，地点轴的第一条才会落在教室外。
#
# ── 固定事实：上学 ──
#
# 人设事实以 `doc/Mittes角色设定正式版.md` 为准；时间格、课表和校内布局是骨架
# 自己的安排，人设里没有，改了不影响别处。
#
# 东洋高等学校二年 A 班（千代田区神田三崎町），理科方向，男女共学。
# 通学：曙桥站 → 都营新宿线（经市谷、九段下）→ 神保町站，再步行约八分钟，门到门约 25 分钟。
#
# 上学日时间格：
#
#   07:30-08:45  起床到进校
#   08:45-09:55  进校、早班会前 + 第一节
#   09:55-11:05  课间 + 第二节
#   11:05-12:20  课间 + 第三节
#   12:20-13:10  午休（下午没课的日子：放学班会后离校或留校）
#   13:10-14:20  午休尾巴 + 第五节
#   14:20-15:30  课间 + 第六节
#   15:30-       打扫、放学
#
# 课表（下午只有周二、周四有课）：
#
#         第一份   第二份   第三份   下午
#   周一  现代文   数学     英语     无课（店休，回家）
#   周二  化学     英语     日本史   物理实验 / 情报
#   周三  数学     古典     世界史   无课（留校）
#   周四  英语     物理     数学     体育 / 班会
#   周五  化学     现代文   美术     无课（回店）
#
# 校内地点：本馆一楼是昇降口（鞋柜）、职员室、购买部；本馆三楼是 2年A班教室
# 和走廊；本馆屋顶天台；北馆二楼物理实验室，三楼电脑室、美术室，四楼图书室；
# 两馆之间是中庭；体育馆单独一栋。
#
# 写 title 时用得上的人设：成绩长期年级前列，学得快但不把重心放在学习上；最喜欢
# 数学、物理和历史，数学最好，化学最弱；国语、中文、英语和视觉表达也比较稳；协调性
# 不错、耐力普通、不喜欢长跑。没有加入固定社团，摄影部需要临时模特或帮忙看造型时
# 会去搭把手。有时间自己做便当，忙乱的早晨在路上买面包或饭团。放学后常去神保町
# 旧书店街。早上三个间隔五分钟的闹钟，第二或第三个才起。
#
# ── 固定事实：店 ──
#
# 店铺周一定休，周二至周日 11:00 营业、21:00 打烊。
# 冬季版起 Mittes 周二至周五 18:00–21:00 当班，周六 17:00–21:00 当班；周日店照开，
# 由 Sweyn 看店，她不上班。祝日落在周二至周日时照常 18:00–21:00 当班。
# 白天和放学后由 Sweyn 看店；Niya 上课日 18:00–21:00 和她同班。
# 当班日打烊后三个人吃员工餐，这段算自由时间，不算当班。
# 每周认真整理一次房间，在周一店休，顺带洗床品。
# 正式拍摄和漫展不进周表，要排的时候从前端「生成指定日期日程」单独生成。
#
# ── 一周的固定去处 ──
#
# 课余去处按星期几固定下来，每周重复，story 写的是这周去那里具体是什么样：
#
#   周一  下午  和店长去新宿的大超市，采购店里和家里一周要用的东西
#   周二  放学  神保町旧书店街（和 Niya）
#   周三  下午  秋叶原，看动画周边和漫画（和 Niya）
#   周四  放学  水道桥的卡拉 OK（和 Niya）；回来顺路去荒木町的超市买菜
#   周五  下午  新宿的布料手艺店和纪伊国屋书店（一个人）；回家做 Cos 服
#   周六  白天  原宿、表参道逛街，在常去的咖啡店歇脚（一个人）；17:00 起当班
#   周日  白天  穿白和服在新宿御苑和 Niya 练外拍，再去新宿三丁目的喫茶店选片
#   祝日（店开）上野的国立博物馆（一个人）
#   祝日（店休）神乐坂（和店长）
#
# 只排每周都会发生的事。被人拦下街拍、被叫上黑板、错过电车这类偶发的事
# 不写进 title，要发生由生成侧按负面事件排期或临场决定。
#
# ── 穿搭 ──
#
# 这一版配的是冬季衣柜（东京十二月到二月，`character/wardrobe.toml`）。秋季版骨架与衣柜
# 存档在 `character/seasons/2026-autumn/`。
#
#   上学           黑色西装外套配酒红领结和灰格纹百褶裙
#   体育课         红色运动外套配白色体操衫和运动长裤（周四第五节）
#   店里当班       三套轮换：
#                    素色酒红和服配藏青袴与白围裙    周二、周四
#                    黑色长袖长裙女仆装配白色长围裙  周三、周六
#                    白色蕾丝领和服配红色腰带        周五、祝日店开（周日外拍也穿它）
#   在家           浅雾蓝荷叶领长袖睡裙为主（起床后的早午饭、洗完澡以后都穿它）；
#                  刚到家要出门、或下楼帮店长时穿牛仔背带裙配燕麦色高领毛衣和棕色马丁靴
#   睡觉           浅雾蓝荷叶领长袖睡裙
#   出门           牛仔背带裙配羊羔绒短夹克（周一和店长去新宿的超市）
#                  酒红棒球外套（周六原宿）
#                  驼色短大衣（周五新宿、祝日上野）
#                  奶白粗棒针开衫配深蓝牛仔长裙（祝日神乐坂）
#
# 振袖留给参拜，不进周表；要去参拜的那天从前端「生成指定日期日程」单独生成。
# 换季时衣柜和这份骨架一起整份替换，两边的名字要对得上。
#
# ── 九张表 ──
#
#   schedule_mon ~ schedule_sun  周一到周日
#   schedule_holiday_shift       祝日，学校休、店照开（祝日落在周二~周日）
#   schedule_holiday_free        祝日，学校和店都休（祝日落在周一）
#
# 祝日用哪张表由代码按日期自动选，不用手写。`schedule_holiday_free` 的内容
# 不要和周日那张撞：它前一天必然是周日，两天不能是同一种过法。
#
# 校历上的特殊日子（文化祭、体育祭、考试周、休校日）写进文末的
# `[calendar.override]`，一行 `"2026-10-31" = "schedule_holiday_free"`，
# 优先级高于祝日规则和星期几。


# ══════════════════════════ 底稿 ══════════════════════════
# 冷启动、生成失败、缓存缺失时顶上的默认状态，按 kind 各一套。
# story 不在这里写，由 title + place 现拼一句；topic 和 places 底稿一律留空。

[fallback."睡眠"]
manner = "你睡得正沉，被吵醒的话反应会慢半拍，话也接不太上。"
mood   = "迷糊，还没醒透"

[fallback."工作"]
manner = "你手上一直有事，说话容易被打断，接得急也短。"
mood   = "专注，绷着一根弦"

[fallback."上学"]
manner = "你人在一件正事里，回话简短，注意力只分得出一点。"
mood   = "端着劲，不太松"

[fallback."自由"]
manner = "你这会儿是松着的，说话慢悠悠，容易顺着话题跑远。"
mood   = "松弛，懒洋洋"

[fallback."通勤"]
manner = "你在路上，回话短，隔一会儿才接一句。"
mood   = "悬着，等着到地方"

[fallback."外出"]
manner = "你的注意力分了一半给周围，回话短，偶尔会断一下。"
mood   = "轻快，有点分神"

