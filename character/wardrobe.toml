# ── 楼下：吃早饭、帮 Sweyn 搭把手、店里没客人时坐角落 ──
# 住在店楼上就一定需要这么一套：家居服绝不能穿进营业区，女仆装又没在当班。
[wardrobe."有口袋的米白棉布连衣裙"]
hair        = "低马尾，用黑色丝带随手一系；刘海拿素银发夹别到一边"
top         = "米白色棉布连衣裙，落肩短袖，领口两颗木质小扣子，只扣下面那颗"
bottom      = "同一件，直筒不收腰，长度到膝盖上面一点；侧缝两个藏起来的口袋——她挑中这条有一半是因为有口袋"
feet        = "深棕色皮质凉拖，一根宽带横过脚背，走木地板几乎没声音，不会吵到看书的客人"
accessories = "手腕上一根细麻绳编的手绳，磨得有点起毛；口袋里通常揣着手机和一支笔"


