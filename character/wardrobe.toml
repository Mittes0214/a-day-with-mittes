# Mittes 的衣柜（冬 · 十二月到二月）
# 2026-11-14 定稿并启用；秋季版存档在 character/seasons/2026-autumn/。
#
# 每套穿搭有一个名字，骨架的时段只填这个名字。两处用途、两种粒度：
#
#   名字   → 写进时段生成的 prompt，是 story 拿到的**全部**服装信息
#   细节   → 保存在衣柜和管理页，**绝不进 story 的 prompt**
#   设定图 → 穿搭查询工具按套装名返回，planner 与 replyer 共用原图
#
# 为什么这么分：从头到脚的清单喂进 story，会把它往服装说明书上带，
# 也会把注意力从「发生了一件事」拽开。story 要的是一句话就能带出画面的东西。
#
# ── 命名规则（这套设计成败全在这里）──
#
#   ✓ 有具体单品，能直接落进句子：黑白女仆装 / 米白短风衣配酒红格纹百褶裙
#   ✗ 抽象类别词，写手拿到等于没拿到：便服 / 家居服 / 私服
#   ✗ 编号，直接毁掉整个设计：私服 A / 工作装 1
#
# ── 字段 ──
#
# hair / top / bottom / legs / feet / accessories，按从头到脚排；
# underwear 单列内搭，上装与内裤分行描述，不包含安全裤。
# 内衣写日常穿着的配色、面料、剪裁和收边；同类内衣有换洗件，
# 套装中的描述是常用搭配，不表示每换一次外衣就换一次内衣。
# legs 区分针织袜和丝袜：丝袜写颜色、D 数、表面质感及纹样，
# 针织袜写织纹、长度和袜口；两种不混称。D 数用于区分衣柜里的薄厚。
# **袜子和鞋都要写**，只有真的没有（睡觉赤脚）才省掉那一行。
# optional 放不是每天都会加的东西，工具回答时要说明它是可选的。
#
# ── 不做图层 ──
#
# 外套本身就是套装名的出门装（风衣、西装外套）照常立一套；除此之外，
# 「在某一套外面再加一件」不另立。加一件开衫是**叙事事件**不是衣柜状态——
# story 可以让她出门顺手抓件开衫，而工具回答的套装名仍然成立。
#
# ── 季节 ──
#
# 这版是**冬天**，按东京十二月到二月配的：白天 10℃ 上下、早晚 2–5℃，
# 偶尔下雪。店里、教室和家里都有暖气，所以室内那几套不用穿得很厚，
# 出门的几套才是大衣、围巾的天气；衣柜里不放羽绒服。
# 换季整份替换，不打补丁，骨架 `schedule/skeleton.toml` 里的 outfit 跟着一起换。
# 内搭沿用秋季版同一用途的设计；保暖靠外层的毛衣、连裤袜和外套。
#
# ── 风格 ──
#
# 设计依据（人设外貌）：银白长发、内层和发梢过渡浅粉；偏暖的红色杏眼；皮肤白；
# 骨架小、身形纤细、腰线明显；偏好轮廓干净、配色明确的款式，喜欢丝带和金属饰品；
# 两耳有耳洞，戴耳钉而不是耳夹。所以：配色要和白发拉开对比，不整身发白；
# 酒红、砖红可以呼应眼睛；宽松单品要配高腰或收腰，避免压住小骨架。
#
# 出门几套要像高中生自己的私服：连帽卫衣、牛角扣大衣、棒球外套、运动鞋这类，
# 不穿得像上班族或社交场合（长大衣配丝绒裙、皮手套、漆皮包这类不要）。
# 校服按现实里普通的日本高中来，不做有辨识度的设计，避免和动画作品撞款。
# 不写可选单品（生图时模型不好判断）；不写发夹、耳机、耳钉、挂件这类小件，包可以写。
# 冬季版每套独立设计，不沿用秋季版的单品、配色或细节，也不限定统一的风格路线；
# 每套的轮廓、主色和材质尽量拉开，九套之间不撞款。
# 她比较怕冷，出门几套都有足够厚的外层；衣柜里不放羽绒服。


# 不属于任何一套、工具回答时并进去的底子。
