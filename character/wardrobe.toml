# Mittes 的衣柜（夏 · 暑假）
#
# 每套穿搭有一个名字，骨架的时段只填这个名字。两处用途、两种粒度：
#
#   名字   → 写进时段生成的 prompt，是 story 拿到的**全部**服装信息
#   细节   → 只给穿搭查询工具，**绝不进 story 的 prompt**
#
# 为什么这么分：从头到脚的清单喂进 story，会把它往服装说明书上带，
# 也会把注意力从「发生了一件事」拽开。story 要的是一句话就能带出画面的东西。
#
# ── 命名规则（这套设计成败全在这里）──
#
#   ✓ 有具体单品，能直接落进句子：黑白女仆装 / 系黑丝带的白色连衣裙
#   ✗ 抽象类别词，写手拿到等于没拿到：便服 / 家居服 / 私服
#   ✗ 编号，直接毁掉整个设计：私服 A / 工作装 1
#
# ── 字段 ──
#
# hair / top / bottom / legs / feet / accessories，按从头到脚排。
# **袜子和鞋都要写**，只有真的没有（在家光脚穿拖鞋、睡觉赤脚）才省掉那一行。
# optional 放不是每天都会加的东西，工具回答时要说明它是可选的。
#
# ── 不做图层 ──
#
# 「连衣裙 + 开衫」不另立一套。加一件外套是**叙事事件**不是衣柜状态——
# story 可以让她出门顺手抓件开衫，而工具回答「她穿着系黑丝带的白色连衣裙」仍然成立。
#
# ── 季节 ──
#
# 这版是**夏天的暑假**，东京湿热。换季整份替换，不打补丁。
# 她很清楚长发在这种天气里有多难受，热到一定程度会直接把头发临时盘起来，
# 不会为了维持造型硬撑——这条对每一套都成立。


# 不属于任何一套、工具回答时并进去的底子。
[always]
hair_base = "银白色长发，内层、发梢和靠近脸颊的部分过渡成浅樱粉，长度过腰接近臀部；额前刘海轻薄，头顶一束呆毛压不下去"
nails     = "干净的浅色或透明款，自己贴的；漫展或拍摄前才会按造型换颜色"
props     = "猫耳、猫尾、铃铛都是道具，不是身上长的。猫耳偶尔在店里戴，猫尾只用于主题活动和宣传拍摄"


# ── 店里当班 ──
[wardrobe."黑白女仆装"]
hair        = "双马尾，扎得比平时牢，用黑色丝带在根部各系一个小蝴蝶结——头发不能靠近食物，这是实用考虑不是造型"
top         = "黑色连衣裙上身，方领，短泡泡袖，领口和袖口各滚一圈细白蕾丝；前襟一排小小的银色圆扣，最上面那颗磨得比别的亮"
bottom      = "同一条裙子的裙摆，及膝，内衬一层薄纱把弧度撑起来；转身时裙摆会慢半拍"
legs        = "白色短袜，袜口翻折出一道细蕾丝边"
feet        = "黑色圆头单鞋，低跟，脚背一根横带扣着一枚小银搭扣；站一晚上不废脚"
accessories = "白色围裙，肩带和下摆缀荷叶边，腰后系一个大蝴蝶结；白色蕾丝发箍；胸前别一枚小小的银色咖啡杯胸针；围裙口袋里插着点单本和一支笔"
optional    = "猫耳发箍——只在店里活动日或要拍宣传照时戴，不是每天"


