# Mittes 一周时段骨架（夏 · 暑假）
#
# 字段说明
#   start / end  时段边界。**逻辑日从 02:00 起算，跨零点用 24:00+ 记法**，见下
#   title        时段名称，几个词，不写文笔
#   place        地点          ┐
#   outfit       穿搭名字      ├ 给 LLM 的素材支点，不是机器读的
#   company      在场的人      ┘
#   kind         性质，机器读：睡眠 / 工作 / 上学 / 自由 / 通勤 / 外出
#
# ── 逻辑日：02:00 → 次日 02:00 ──
#
# 一天不从零点开始，从她入睡的 02:00 开始，到次日 02:00 结束。跨零点那一段
# 写成 `24:00-26:00`（日本的节目表就是这么记的），归属**当天**而不是次日。
#
# 为什么：按日历日切会把同一个夜晚劈成两半，写骨架的人在 24:00 收笔、在 00:00
# 重新起笔，于是同一个晚上被设计了两次收尾——旧版就出现过「23:00 睡前护肤 →
# 次日 00:00 卸妆」这种倒序。而且「已清醒几小时」是从当天最后一个睡眠段之后
# 算的，凌晨那段前面没有睡眠段，会算出「清醒 0 小时」，正好在她一天里最累的
# 时刻告诉模型她刚睡醒。
#
# 睡眠段放在逻辑日**开头**，所以「已清醒」自动从起床那一刻算起，不用改代码。
#
# ── 切分原则 ──
#
#   1. 清醒时段 1~3.5 小时，不超过 4 小时。
#   2. 睡眠段是唯一例外（5.5~8 小时），一段到底——切开没有意义，
#      拆成两段只会让生成器为「睡着的第二段」白写一次 story。
#   3. 有几段只有 1 小时（换装、洗澡、临睡前），是有意保留的：
#      它们的 place / outfit / company 跟前后段都不同，合并会丢掉支点。
#
# ── outfit 填的是穿搭名字 ──
#
# 取值必须是 `wardrobe.toml` 里的套装名。骨架只填名字，从头到脚的细节在那边，
# 只给穿搭查询工具用，不进 story 的 prompt。
#
# 唯一的例外是周五拍摄现场的 `当天的拍摄服装`——那是品牌方或角色的衣服，
# 每次都不同，不在衣柜里。查询工具遇到查不到的名字应当照实回答「每次不同」。
#
# ── 关于上学 ──
#
# 现在是暑假，全周只有周三上午一段 kind = "上学"（文化祭班级企划）。
# 她不加入固定社团，所以没有社团活动段。开学后要另写一套学期骨架，整份替换。
#
# ── 关于天气 ──
#
# 骨架里不写天气，天气来自 Open-Meteo 实时查询。露台、逛街这类户外段遇到坏天气，
# 由 LLM 自行改写成室内的做法，骨架不动。
#
# ── 一周作息 ──
#
#   当班：周二、周四、周六（周六是周末长班）
#   出门：周三（学校 + 和 Niya）、周五（拍摄）、周日（一个人逛，会被街拍）
#   全休：周一


# ══════════════════════════ 底稿 ══════════════════════════
# 冷启动、生成失败、缓存缺失时顶上的默认状态，按 kind 各一套。
# story 不在这里写，由 title + place 现拼一句；topic 和 places 底稿一律留空。

[fallback."睡眠"]
manner = "你睡得正沉，被吵醒的话反应会慢半拍，话也接不太上。"
mood   = "迷糊，还没醒透"

[fallback."工作"]
manner = "你手上一直有事，说话容易被打断，接得急也短。"
mood   = "专注，绷着一根弦"

[fallback."上学"]
manner = "你人在一件正事里，回话简短，注意力只分得出一点。"
mood   = "端着劲，不太松"

[fallback."自由"]
manner = "你这会儿是松着的，说话慢悠悠，容易顺着话题跑远。"
mood   = "松弛，懒洋洋"

[fallback."通勤"]
manner = "你在路上，回话短，隔一会儿才接一句。"
mood   = "悬着，等着到地方"

[fallback."外出"]
manner = "你的注意力分了一半给周围，回话短，偶尔会断一下。"
mood   = "轻快，有点分神"


