# Mittes 一周时段骨架（重构版草稿，待审）
#
# 对应设计文档：/home/mittes/Mittes-1.0.0-dev/a_day_with_mittes-重构设计.md 第 4 节
# 本文件是给人看的草稿，审定后再并进 config.toml。
#
# 字段说明
#   start / end  时段边界，24 小时制
#   title        时段名称，几个词，不写文笔
#   place        地点          ┐
#   outfit       服装          ├ 给 LLM 的素材支点，不是机器读的
#   company      在场的人      ┘
#   kind         性质，机器读：睡眠 / 工作 / 上学 / 自由 / 通勤 / 外出
#
# 切分原则
#   1. 清醒时段一律 1~3.5 小时，不超过 4 小时。
#   2. 睡眠段是唯一的例外（5.5~7.5 小时），一段到底——切开没有意义，
#      拆成两段只会让生成器为「睡着的第二段」白写一次 story。
#   3. 有几段只有 1~1.5 小时（换装准备、洗澡、睡前护肤），是有意保留的：
#      它们的 place / outfit / company 跟前后段都不同，合并会丢掉支点。
#
# 关于上学
#   现在是日本的暑假，所以全周没有 kind = "上学" 的时段。
#   开学后需要另写一套学期骨架（周一~周五白天替换为上学 + 通学），
#   届时店里的班次要往后压。这份文件只覆盖暑假。
#
# 关于天气
#   骨架里不写天气。旧日程把周二写成了固定的雨天，新版天气来自 Open-Meteo 实时查询，
#   由生成时决定当天下不下雨。露台写生、涩谷逛街这类户外段遇到坏天气，
#   由 LLM 自行改写成室内的做法，骨架不动。
#
# 作息基线（暑假）
#   晚班：周一、周二、周四、周六（周六是短班）
#   全休：周五、周日
#   周三傍晚是画画 + KTV，不上班


# ══════════════════════════ 底稿 ══════════════════════════
# 冷启动、生成失败、缓存缺失时顶上的默认状态，按 kind 各一套。
# story 不在这里写，由 title + place 现拼一句；topic 底稿一律留空。
#
# 写作要求同 manner 正式规则：第二人称、两句以内、**不得出现地点/服装/
# 场所词**。所以这里连"在店里""路上""课上"都不能写。
# 底稿是异常时的兜底，宁可平淡也不要出错——它可能连着挂好几个小时。

[fallback."睡眠"]
manner         = "你睡得正沉，被吵醒的话反应会慢半拍，话也接不太上。"
mood           = "迷糊，还没醒透"
busy           = "睡着了，回得很慢"

[fallback."工作"]
manner         = "你手上一直有事，说话容易被打断，接得急也短。"
mood           = "专注，绷着一根弦"
busy           = "手上有活，回得慢"

[fallback."自由"]
manner         = "你这会儿是松着的，说话慢悠悠，容易顺着话题跑远。"
mood           = "松弛，懒洋洋"
busy           = "闲着，随时能搭话"

[fallback."外出"]
manner         = "你的注意力分了一半给周围，回话短，偶尔会断一下。"
mood           = "轻快，有点分神"
busy           = "不太方便，回得不稳"

[fallback."通勤"]
manner         = "你腾不出手，话说得又短又零碎。"
mood           = "赶着，心不在焉"
busy           = "顾不太上，回得断断续续"

# 暑假期间用不到，开学后的学期骨架会用
[fallback."上学"]
manner         = "你只能偷着回，话很短，也不太敢展开。"
mood           = "绷着，偷偷摸摸"
busy           = "不方便，回得又少又慢"


